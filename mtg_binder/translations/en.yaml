configuration:
  speicherort:
    name: Speicherort für Fotos und Bilder
    description: >-
      Ordner auf dem Netzlaufwerk (z. B. /share/netzlaufwerk/mtg-binder). Die Datenbank bleibt im Add-on.
  mqtt:
    name: Werte an Home Assistant (MQTT)
    description: >-
      Sensoren „MTG …“ über das Mosquitto-Add-on (MQTT mit Discovery), Zugang automatisch vom Supervisor.
