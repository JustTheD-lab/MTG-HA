# Lokales Home-Assistant-Add-on „MTG Binder“ (nur Server und Oberfläche; die Erkennung läuft am PC).
# Gebaut wird der fertige Ordner mit: python -m binderapp.addon.paket  (PYTHONPATH=src)
name: MTG Binder
version: "0.38.0"
slug: mtg_binder
description: Magic-Binder per Foto – Bücherregal, Lesetisch, Kisten und Prüfansicht
arch:
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8098
panel_icon: mdi:book-open-page-variant
panel_title: MTG Binder
panel_admin: true
# Watchdog: Der Supervisor fragt den Server über die Adresse des Add-ons ab und startet ihn neu, wenn er nicht mehr
# antwortet (einschalten mit dem Schalter „Watchdog“ auf der Seite des Add-ons)
watchdog: "http://[HOST]:[PORT:8098]/api/gesund"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Erkennung am PC (Fotos abholen, Ergebnis zurück; nur mit Schlüssel)
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
# Werte an Home Assistant per MQTT mit Discovery; Zugang zum Mosquitto-Add-on liefert der Supervisor
services:
  - mqtt:want
# Proxy-Druck: Stände von Silhouette Card Maker (je rund 150 MB) und Arbeitsordner lädt das Add-on jederzeit neu,
# darum nicht in die Sicherungen von Home Assistant; die Rückseiten (proxy/rueckseiten) bleiben drin.
backup_exclude:
  - "proxy/staende"
  - "proxy/staende/*"
  - "proxy/arbeit"
  - "proxy/arbeit/*"
  - "proxy/kalibrierung"
  - "proxy/kalibrierung/*"
  - "medien/proxy/bilder/*"
options:
  speicherort: ""
  mqtt: true
schema:
  speicherort: str?
  mqtt: bool?
